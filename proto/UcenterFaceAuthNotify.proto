syntax = "proto3";

option optimize_for = SPEED;
option java_multiple_files = true;
option java_outer_classname = "UcenterFaceAuthNotifyProto";
option java_package = "com.mxc.quotation.common.data.vo.pb";

message UcenterFaceAuthNotify {
  int32 status = 1; //认证结果；1-PASS:审核通过；2-REJECT:审核驳回；3-TIMEOUT：超时
}