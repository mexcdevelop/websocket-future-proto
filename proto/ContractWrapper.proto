syntax = "proto3";

option optimize_for = SPEED;
option java_multiple_files = true;
option java_outer_classname = "ContractWrapperProto";
option java_package = "com.mxc.quotation.common.data.vo.pb";

import "IndexPrice.proto";
import "OrderChange.proto";
import "AssetChange.proto";
import "BonusNotify.proto";
import "LeverageMode.proto";
import "NotifyGeneric.proto";
import "LiquidateRiskChange.proto";
import "CommonConfig.proto";
import "MarketOrderDeal.proto";
import "OrderDealDetail.proto";
import "ContractPlanOrder.proto";
import "PositionChange.proto";
import "MarketOrderSetting.proto";
import "PositionReverseChange.proto";
import "WsKLine.proto";
import "UserPreference.proto";
import "ContractExtra.proto";
import "ContractStopOrder.proto";
import "FundingRate.proto";
import "FairPrice.proto";
import "DepthStepInfo.proto";
import "ContractUserRiskLimit.proto";
import "DepthInfo.proto";
import "DepthMerge.proto";
import "Contract.proto";
import "Deal.proto";
import "ContractStopPlanOrder.proto";
import "ContractTrackOrder.proto";
import "PositionModeResult.proto";
import "TickerDetail.proto";
import "TickerList.proto";
import "TickList.proto";
import "OrderChase.proto";
import "EventContract.proto";
import "TickIncrementList.proto";
import "EventContractPositionChange.proto";
import "GridContract.proto";
import "GridAssetTransferResult.proto";
import "GridInvestMultiplier.proto";
import "GridContractRobot.proto";
import "UsStocksContractTradeTimeChange.proto";
import "UcenterFaceAuthNotify.proto";
import "OpenMultiAssetsResult.proto";
import "AllTickOrderBook.proto";
import "PolygonLULD.proto";
import "PolygonQuotes.proto";
import "ContractBlackWhite.proto";
import "UserTradeDeposit.proto";
import "MdayPush.proto";
import "ChaseLimitOrderNotify.proto";
import "SpotEarnAssetAddMargin.proto";
import "SpotEarnAssetCreateOrder.proto";
import "Coupon.proto";
import "EighthAnniversaryPush.proto";

message ContractWrapper {
  string symbol = 1;
  string channel = 2;
  int64 ts = 3;

  oneof data {
    OrderChange orderChange = 1001;
    AssetChange assetChange = 1002;
    BonusNotify bonusNotify = 1003;
    LeverageMode leverageMode = 1004;
    NotifyGeneric notifyGeneric = 1005;
    LiquidateRiskChange liquidateRiskChange = 1006;
    MarketOrderDeal marketOrderDeal = 1007;
    OrderDealDetail orderDealDetail = 1008;
    ContractPlanOrder contractPlanOrder = 1009;
    PositionModeResult positionModeResult = 1010;
    PositionChange positionChange = 1011;
    PositionReverseChange positionReverseChange = 1012;
    UserPreference userPreference = 1013;
    ContractStopOrder contractStopOrder = 1014;
    ContractUserRiskLimit contractUserRiskLimit = 1015;
    ContractStopPlanOrder contractStopPlanOrder = 1016;
    ContractTrackOrder contractTrackOrder = 1017;
    OrderChase orderChase = 1018;
    EventContractPositionChange eventContractPositionChange = 1019;
    GridAssetTransferResult gridAssetTransferResult = 1020;
    GridContractRobot gridContractRobot = 1021;
    UcenterFaceAuthNotify ucenterFaceAuthNotify = 1022;
    OpenMultiAssetsResult openMultiAssetsResult = 1023;
    ContractBlackWhite contractBlackWhite = 1024;
    UserTradeDeposit userTradeDeposit = 1025;
    MdayPush mdayPush = 1026;
    ChaseLimitOrderNotify chaseLimitOrderNotify = 1027;
    SpotEarnAssetAddMargin spotEarnAssetAddMargin = 1028;
    SpotEarnAssetCreateOrder spotEarnAssetCreateOrder = 1029;
    Coupon coupon = 1030;
    EighthAnniversaryPush eighthAnniversaryPush = 1031;

    IndexPrice indexPrice = 2001;
    CommonConfig commonConfig = 2002;
    ContractExtra contractExtra = 2003;
    Contract contract = 2004;
    Deal deal = 2005;
    Deals deals = 2006;
    EventContract eventContract = 2007;
    GridContract gridContract = 2008;
    GridContractInvestMultiplier gridContractInvestMultiplier = 2009;
    UsStocksContractTradeTimeChange usStocksContractTradeTimeChange = 2010;

    MarketOrderSetting marketOrderSetting = 2100;
    WsKLine wsKline = 2101;
    FundingRate fundingRate = 2102;
    FairPrice fairPrice = 2013;
    DepthStepInfo depthStepInfo = 2014;
    DepthInfo depthInfo = 2015;
    DepthMerge depthMerge = 2016;
    TickerDetail tickerDetail = 2017;
    TickerList tickerList = 2018;
    TickList tickList = 2019;
    TickIncrementList tickIncrementList = 2020;
    AllTickOrderBook allTickOrderBook = 2021;
    PolygonLULD polygonLULD = 2022;
    PolygonQuotes polygonQuotes = 2023;
  }
}