syntax = "proto3";

option optimize_for = SPEED;
option java_multiple_files = true;
option java_outer_classname = "RiskLimitProto";
option java_package = "com.mxc.quotation.common.data.vo.pb";

message RiskLimit {
  optional int32 level = 1;
  optional string maxVol = 2;
  optional string mmr = 3;
  optional string imr = 4;
  optional int32 maxLeverage = 5;
}