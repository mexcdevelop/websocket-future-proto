syntax = "proto3";

option optimize_for = SPEED;
option java_multiple_files = true;
option java_outer_classname = "LiquidateRiskChangeProto";
option java_package = "com.mxc.quotation.common.data.vo.pb";

message LiquidateRiskChange {
  string symbol = 1;
  optional int64 positionId = 2;
  optional string liquidatePrice = 3;
  optional string marginRatio = 4;
  int32 adlLevel = 5;
}