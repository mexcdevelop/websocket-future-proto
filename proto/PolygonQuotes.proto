syntax = "proto3";

option optimize_for = SPEED;
option java_multiple_files = true;
option java_outer_classname = "PolygonQuotesProto";
option java_package = "com.mxc.quotation.common.data.vo.pb";

message PolygonQuotes {
  string sym = 1;// The ticker symbol for the given stock.
  int32 bx = 2;// The bid exchange ID.
  string bp = 3;// The bid price.
  int32 bs = 4;// The bid size. This represents the number of round lot orders at the given bid price. The normal round lot size is 100 shares. A bid size of 2 means there are 200 shares for purchase at the given bid price.
  int32 ax = 5;// The ask exchange ID.
  string ap = 6;// The ask price.
  int32 as = 7;// The ask size. This represents the number of round lot orders at the given ask price. The normal round lot size is 100 shares. An ask size of 2 means there are 200 shares available to purchase at the given ask price.
  int32 c = 8;// The condition.
  repeated int32 i = 9;// The indicators. For more information, see https://polygon.io/glossary/conditions-indicators
  int64 t = 10;// The SIP timestamp in Unix MS.
  int64 q = 11;// The sequence number represents the sequence in which quote events happened. These are increasing and unique per ticker symbol, but will not always be sequential (e.g., 1, 2, 6, 9, 10, 11). Values reset after each trading session/day.
  int32 z = 12;// The tape. (1 = NYSE, 2 = AMEX, 3 = Nasdaq).
}
