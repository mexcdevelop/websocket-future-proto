syntax = "proto3";
import "DepthItem.proto";

option optimize_for = SPEED;
option java_multiple_files = true;
option java_outer_classname = "DepthStepInfoProto";
option java_package = "com.mxc.quotation.common.data.vo.pb";

message DepthStepInfo {
  repeated DepthItem asks = 1;
  repeated DepthItem bids = 2;
  int64 version = 3;
  optional string bidMarketLevelPrice = 6; // BigDecimal represented as string
  optional string askMarketLevelPrice = 7; // BigDecimal represented as string
  optional int64 ct = 8;
}

