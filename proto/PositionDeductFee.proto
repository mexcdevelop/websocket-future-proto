syntax = "proto3";

option optimize_for = SPEED;
option java_multiple_files = true;
option java_outer_classname = "PositionDeductFeeProto";
option java_package = "com.mxc.quotation.common.data.vo.pb";

message PositionDeductFee {
  string currency = 1;
  string deductFee = 2;
  string convertSettleFee = 3;
}