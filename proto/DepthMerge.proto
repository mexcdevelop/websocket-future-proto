syntax = "proto3";
import "DepthItem.proto";

option optimize_for = SPEED;
option java_multiple_files = true;
option java_outer_classname = "DepthMergeProto";
option java_package = "com.mxc.quotation.common.data.vo.pb";

message DepthMerge {
  repeated DepthItem asks = 1;
  repeated DepthItem bids = 2;
  int64 beginVersion = 3;
  int64 endVersion = 4;
  int64 timestamp = 5;
  int64 cts = 6;
}

