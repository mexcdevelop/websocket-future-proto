syntax = "proto3";

option optimize_for = SPEED;
option java_multiple_files = true;
option java_outer_classname = "PolygonLULDProto";
option java_package = "com.mxc.quotation.common.data.vo.pb";

message PolygonLULD {
  string sym = 1;// The ticker symbol for the given stock.
  string h = 2;// The high price.
  string l = 3;// The low price.
  repeated int32 i = 4;// The indicators. For more information, see https://polygon.io/glossary/conditions-indicators
  int64 t = 5;// The SIP timestamp in Unix MS.
  int64 q = 6;// The sequence number represents the sequence in which quote events happened. These are increasing and unique per ticker symbol, but will not always be sequential (e.g., 1, 2, 6, 9, 10, 11). Values reset after each trading session/day.
  int32 z = 7;// The tape. (1 = NYSE, 2 = AMEX, 3 = Nasdaq).
}
