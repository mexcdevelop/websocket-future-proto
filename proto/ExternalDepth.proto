syntax = "proto3";

option optimize_for = SPEED;
option java_multiple_files = true;
option java_outer_classname = "ExternalDepthProto";
option java_package = "com.mxc.quotation.common.data.vo.pb";

message ExternalDepth {
  string price = 1; // BigDecimal represented as string
  string vol = 2; // BigDecimal represented as string
}
