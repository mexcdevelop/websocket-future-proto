syntax = "proto3";
import "TickIncrement.proto";

option optimize_for = SPEED;
option java_multiple_files = true;
option java_outer_classname = "TickIncrementListProto";
option java_package = "com.mxc.quotation.common.data.vo.pb";

message TickIncrementList {
  repeated TickIncrement tickIncrement = 1;
}